name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [cms-publish]

env:
  FIREBASE_PROJECT_ID: tradeinsolutions-6f0e9

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          export NPM_CONFIG_CACHE="${RUNNER_TEMP}/.npm"
          mkdir -p "$NPM_CONFIG_CACHE"
          npm cache clean --force
          npm ci --no-audit --no-fund

      - name: Configure Firebase credentials for CMS build
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "${RUNNER_TEMP}/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/gcp-key.json" >> "$GITHUB_ENV"
          echo "FIREBASE_SERVICE_ACCOUNT_JSON<<EOF" >> "$GITHUB_ENV"
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://tradeinsolutions-6f0e9.web.app' }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ env.FIREBASE_PROJECT_ID }}

  deploy_functions:
    runs-on: ubuntu-latest
    needs: build_and_deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: |
          export NPM_CONFIG_CACHE="${RUNNER_TEMP}/.npm"
          mkdir -p "$NPM_CONFIG_CACHE"
          npm cache clean --force
          npm ci --no-audit --no-fund
          npm ci --prefix functions --no-audit --no-fund

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: npx firebase-tools deploy --only functions,firestore:rules,storage --project tradeinsolutions-6f0e9 --non-interactive
